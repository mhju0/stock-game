name: keepalive

# Adds periodic database activity during Supabase's Free Plan low-activity
# window (and warms Render) by running a real query every 3 days. This reduces
# idle time but does not guarantee that the free project cannot be paused.
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health/db
        run: |
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 30 --retry-all-errors \
            --max-time 120 \
            https://stock-game-6411.onrender.com/health/db
