name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major version as the production Supabase database (17.x).
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: stock_game_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stock_game_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUDIT_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/stock_game_audit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: PYTHON=python ../scripts/verify.sh backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same major version as the Vercel project's build setting (24.x).
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      # --with-deps installs system packages from the Ubuntu archive. When the
      # archive is unreachable, fall back to the browser alone: the runner image
      # already carries Chrome's shared libraries, and the tests still decide.
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
        timeout-minutes: 20
      - run: ../scripts/verify.sh frontend
