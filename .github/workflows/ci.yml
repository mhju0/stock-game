name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        # Same major version as the production Supabase database (17.x).
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: stock_game_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stock_game_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUDIT_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/stock_game_audit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ../scripts/check.sh --part backend
        env:
          PYTHON: python

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same major version as the Vercel project's build setting (24.x).
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # --with-deps installs system packages from the Ubuntu archive. When the
      # archive is unreachable, fall back to the browser alone: the runner image
      # already carries Chrome's shared libraries, and the tests still decide.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium || npx playwright install chromium
        timeout-minutes: 20
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium || true
        timeout-minutes: 20
      - run: ../scripts/check.sh --part frontend
